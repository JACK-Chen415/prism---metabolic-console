# See https://docs.render.com/blueprint-spec for docs

services:
  # FastAPI 后端
  - type: web
    name: prism-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # 应用环境（生产必须触发强配置校验）
      - key: APP_ENV
        value: production
      - key: OTP_PROVIDER
        value: audit_only
      # 数据库连接（在 Neon 控制台获取）
      - key: DATABASE_URL
        sync: false
      # JWT 密钥（生产环境使用强随机字符串）
      - key: JWT_SECRET_KEY
        generateValue: true
      # 豆包 AI 配置
      - key: ARK_API_KEY
        sync: false
      - key: DOUBAO_MODEL
        sync: false
      # CORS
      - key: CORS_ORIGINS
        value: '["https://prism-metabolic-console.vercel.app"]'
      # 应用配置
      - key: DEBUG
        value: "false"
